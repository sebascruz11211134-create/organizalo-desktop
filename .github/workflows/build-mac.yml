name: Build & Deploy Mac Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install

      - name: Build macOS (.dmg)
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true

      - name: Encontrar el .dmg generado
        id: dmg
        run: |
          DMG=$(find . -name "*.dmg" | head -1)
          echo "path=$DMG" >> $GITHUB_OUTPUT
          echo "Archivo encontrado: $DMG"
          ls -lh "$DMG" || echo "No se encontró .dmg"

      - name: Subir .dmg al VPS
        if: steps.dmg.outputs.path != ''
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          echo "$VPS_SSH_KEY" > /tmp/vps_key
          chmod 600 /tmp/vps_key
          scp -i /tmp/vps_key \
              -o StrictHostKeyChecking=no \
              "${{ steps.dmg.outputs.path }}" \
              root@31.97.141.124:/var/www/downloads/Organizalo-mac.dmg
          rm -f /tmp/vps_key
          echo "✓ Subido a http://31.97.141.124/descargar/Organizalo-mac.dmg"
